name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - '.kiro/**'
      - 'docs/**'
      - 'scripts/**'
      - '.env.example'
      - '.gitignore'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prisma Generate
        run: npx prisma generate --schema=prisma/schema.prisma
        if: hashFiles('prisma/schema.prisma') != ''

      - run: npm run build:api

      - run: npm run build:web

      - name: Testes — API
        run: npm run test:api

      - name: Testes — Web
        run: npm run test:web

      # ---------------------------------------------------------------------
      # Migração em andamento: enquanto o backend Python existir, a suíte
      # pytest continua sendo um gate. Remover este bloco junto com backend/.
      # ---------------------------------------------------------------------
      - name: Backend legado — existe?
        id: legado
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.legado.outputs.existe == 'true'
        with:
          python-version: '3.12'

      - name: Testes — backend legado (pytest)
        if: steps.legado.outputs.existe == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend && python -m pytest -q
