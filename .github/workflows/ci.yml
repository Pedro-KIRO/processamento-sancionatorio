# CI — roda a cada push e PR em qualquer branch (exceto main, que é do Tech Lead).
# Valida que o código compila, os testes passam e o build de produção funciona.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: detran
          POSTGRES_PASSWORD: detran_ci
          POSTGRES_DB: processamento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U detran"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Rodar testes
        working-directory: backend
        env:
          DATABASE_URL: postgresql://detran:detran_ci@localhost:5432/processamento_test
          AUTH_ENABLED: "false"
        run: python -m pytest -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Testes
        working-directory: frontend
        run: npm test

      - name: Build de produção
        working-directory: frontend
        run: npm run build
