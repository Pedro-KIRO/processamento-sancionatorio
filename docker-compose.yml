# Docker Compose para DESENVOLVIMENTO LOCAL.
#
# Sobe o PostgreSQL 16 e a API NestJS. O frontend roda fora do Docker
# (`npm run dev:web`) porque o hot reload do Vite é mais rápido assim.
#
# Uso: docker compose up -d
#
# Conforme .kiro/steering/onboarding-fase0.md, o Docker deve estar instalado
# DENTRO do WSL (via apt), não via Docker Desktop.
#
# Durante a migração, o backend Python continua sendo executado à parte
# (uvicorn na porta 8000) e a API NestJS repassa para ele os caminhos ainda
# não portados. Ver apps/api/src/app/legacy/.
services:
  postgres:
    image: postgres:16-alpine
    container_name: processamento-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-detran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detran_local}
      POSTGRES_DB: ${POSTGRES_DB:-processamento}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria o schema gestao_acessos_v2 local na PRIMEIRA subida do volume.
      # Sem ele o PermissionsModule falha no construtor e a API não sobe.
      # Para reaplicar após editar o .sql: docker compose down -v
      - ./prisma/dev:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-detran}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: processamento-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-detran}:${POSTGRES_PASSWORD:-detran_local}@postgres:5432/${POSTGRES_DB:-processamento}?schema=processamento
      PERMISSIONS_DATABASE_URL: ${PERMISSIONS_DATABASE_URL:-postgresql://detran:detran_local@postgres:5432/processamento?schema=gestao_acessos_v2}
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_USER: ${DEV_USER:-}
      PORT: 3001
      TZ: America/Sao_Paulo
      # Ponte de migração: host.docker.internal alcança o uvicorn rodando no host.
      LEGACY_API_URL: ${LEGACY_API_URL:-http://host.docker.internal:8080}
      LEGACY_PROXY_ENABLED: ${LEGACY_PROXY_ENABLED:-true}
      SEI_TOKEN_URL: ${SEI_TOKEN_URL:-}
      SEI_CLIENT_ID: ${SEI_CLIENT_ID:-}
      SEI_CLIENT_SECRET: ${SEI_CLIENT_SECRET:-}
      SEI_API_BASE: ${SEI_API_BASE:-}
      SEI_SIGLA_SISTEMA: ${SEI_SIGLA_SISTEMA:-}
      SEI_IDENTIFICACAO_SERVICO: ${SEI_IDENTIFICACAO_SERVICO:-}
      SEI_TRACE_ID: ${SEI_TRACE_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
