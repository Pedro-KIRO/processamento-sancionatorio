# Nginx config para SPA (React Router).
# Toda rota que não é arquivo estático vai para index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache de assets (JS/CSS/imagens com hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para a API (em produção, Nginx da DTI faz isso; aqui é para rodar
    # o container de produção standalone, se necessário)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
