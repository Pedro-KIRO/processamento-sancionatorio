<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Bola base branca -->
  <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#222" stroke-width="0.8"/>
  <!-- Painéis triangulares estilo Trionda - Copa 2026 -->
  <!-- Painel turquesa (topo) -->
  <polygon points="16,3 21,10 11,10" fill="#00B2A9"/>
  <!-- Painel coral (esquerda) -->
  <polygon points="4,14 11,10 11,20" fill="#E4485E"/>
  <!-- Painel dourado (direita) -->
  <polygon points="28,14 21,10 21,20" fill="#D4A843"/>
  <!-- Painel turquesa escuro (inferior esquerdo) -->
  <polygon points="8,26 11,20 16,24" fill="#007A78"/>
  <!-- Painel coral claro (inferior direito) -->
  <polygon points="24,26 21,20 16,24" fill="#F47B6C"/>
  <!-- Painel roxo (centro inferior) -->
  <polygon points="11,20 21,20 16,24" fill="#5B2D8E"/>
  <!-- Painel azul (centro) -->
  <polygon points="11,10 21,10 21,20 11,20" fill="none" stroke="#222" stroke-width="0.4"/>
  <!-- Detalhe central -->
  <polygon points="13,12 19,12 19,18 13,18" fill="#00B2A9" opacity="0.3"/>
  <!-- Linhas de costura -->
  <line x1="16" y1="3" x2="11" y2="10" stroke="#222" stroke-width="0.4"/>
  <line x1="16" y1="3" x2="21" y2="10" stroke="#222" stroke-width="0.4"/>
  <line x1="4" y1="14" x2="11" y2="10" stroke="#222" stroke-width="0.4"/>
  <line x1="4" y1="14" x2="11" y2="20" stroke="#222" stroke-width="0.4"/>
  <line x1="28" y1="14" x2="21" y2="10" stroke="#222" stroke-width="0.4"/>
  <line x1="28" y1="14" x2="21" y2="20" stroke="#222" stroke-width="0.4"/>
  <line x1="11" y1="20" x2="8" y2="26" stroke="#222" stroke-width="0.4"/>
  <line x1="16" y1="24" x2="8" y2="26" stroke="#222" stroke-width="0.4"/>
  <line x1="21" y1="20" x2="24" y2="26" stroke="#222" stroke-width="0.4"/>
  <line x1="16" y1="24" x2="24" y2="26" stroke="#222" stroke-width="0.4"/>
  <line x1="11" y1="20" x2="16" y2="24" stroke="#222" stroke-width="0.4"/>
  <line x1="21" y1="20" x2="16" y2="24" stroke="#222" stroke-width="0.4"/>
  <!-- Brilho -->
  <ellipse cx="11" cy="9" rx="3" ry="2" fill="#fff" opacity="0.4"/>
</svg>
