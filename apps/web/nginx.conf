# Nginx config para SPA (React Router).
# Toda rota que não é arquivo estático vai para index.html.
#
# Porta 3000 é a convenção de frontend da plataforma DTI — o nginx da VM
# encaminha para cá (ver homolog.docker-compose.yml).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache de assets (JS/CSS/imagens com hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para a API. Em homologação o nginx da VM já roteia /api para o
    # contêiner de backend; esta entrada serve para rodar o contêiner de
    # produção isolado. O nome do serviço segue a convenção SISTEMA-back.
    location /api/ {
        proxy_pass http://processamento-back:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
